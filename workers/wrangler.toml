name = "whatview-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "streamly-db-v2"
database_id = "26d3087f-71d7-45d2-bdb8-aef51cceb8e0"

# Environment variables (set in .dev.vars for local, Cloudflare secrets for production)
# [vars]
# TMDB_API_KEY = ""
# YOUTUBE_API_KEY = ""

# Cron Triggers (스케줄된 태스크) - 무료 플랜 최대 5개
[triggers]
crons = [
  "0 3 * * *",       # 매일 03:00 UTC (12:00 KST) - TMDB 인기 콘텐츠 수집
  "0 */6 * * *",     # 6시간마다 - 빠른 업데이트
  "*/10 4-5 * * *"   # 04:00-06:00 UTC (13:00-15:00 KST) 10분마다 - YouTube 리뷰 (Piped API)
]

# Development settings
[dev]
port = 8787
local_protocol = "http"
